[package]
name = "stomper-game"
version = "0.1.0"
edition = "2024"
default-run = "stomper-game"

[features]
default = []
web = ["bevy/web", "bevy/webgl2"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "2d_bevy_render",
    "bevy_winit",
    "x11",
    "default_font",
    "png",
] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.wasm-release]
inherits = "release"
strip = "symbols"

[[bin]]
name = "stomper-game"
path = "src/main.rs"